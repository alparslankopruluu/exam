name: Exam
options:
  bundleIdPrefix: com.techtactoe
  deploymentTarget:
    iOS: "18.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.19.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 10.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: UYDAF6RY67
    CODE_SIGN_STYLE: Automatic
    # Phone-first, portrait UI. iPad runs it as an iPhone app.
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  Exam:
    type: application
    platform: iOS
    sources:
      - path: Exam
        excludes:
          - "*.storekit"
      - Shared
      - path: ../content/locales
        type: folder
        buildPhase: resources
      - path: ../content/packs
        type: folder
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: ExamWidget
      - target: ExamNotificationService
    entitlements:
      path: Exam/Exam.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.security.application-groups: [group.com.techtactoe.examly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techtactoe.examly
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Exam/Info.plist
        # REVERSED_CLIENT_ID from GoogleService-Info.plist (examly-study); public, not a secret.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.839662717641-3k47efjl1pmrd5olgk8p9sn8rhbg5omt
        PRODUCT_NAME: Exam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Examly
        # The design system is light-only; keep it in dark mode too (Android uses a Light theme).
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voice Tutor uses the microphone only while you are asking a spoken study question."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 9
        MARKETING_VERSION: 1.0.1
    postBuildScripts:
      - name: Firebase Crashlytics Symbols
        basedOnDependencyAnalysis: false
        script: |
          if [ -f "${PROJECT_DIR}/Exam/GoogleService-Info.plist" ]; then
            FIREBASE_RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
            if [ -x "${FIREBASE_RUN}" ]; then
              "${FIREBASE_RUN}"
            else
              echo "warning: Firebase Crashlytics run script not found; skipping symbol upload"
            fi
          else
            echo "Firebase config absent; skipping Crashlytics symbol upload"
          fi

  ExamNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - ExamNotificationService
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techtactoe.examly.NotificationService
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ExamNotificationService/Info.plist
        CURRENT_PROJECT_VERSION: 9
        MARKETING_VERSION: 1.0.1
        SKIP_INSTALL: YES

  ExamWidget:
    type: app-extension
    platform: iOS
    sources:
      - ExamWidget
      - Shared
    entitlements:
      path: ExamWidget/ExamWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.techtactoe.examly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techtactoe.examly.Widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Examly
        # The design system is light-only; keep it in dark mode too (Android uses a Light theme).
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_FILE: ExamWidget/Info.plist
        CURRENT_PROJECT_VERSION: 9
        MARKETING_VERSION: 1.0.1
        SKIP_INSTALL: YES

schemes:
  Exam:
    build:
      targets:
        Exam: all
    run:
      config: Debug
      storeKitConfiguration: Exam/Exam.storekit
    archive:
      config: Release
