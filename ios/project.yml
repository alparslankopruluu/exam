name: Exam
options:
  bundleIdPrefix: com.kprl
  deploymentTarget:
    iOS: "18.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.19.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  Exam:
    type: application
    platform: iOS
    sources:
      - Exam
    resources:
      - path: ../content
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kprl.exam
        PRODUCT_NAME: exam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: exam
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voice Tutor uses the microphone only while you are asking a spoken study question."
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    postBuildScripts:
      - name: Firebase Crashlytics Symbols
        basedOnDependencyAnalysis: false
        script: |
          if [ -f "${PROJECT_DIR}/Exam/GoogleService-Info.plist" ]; then
            FIREBASE_RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
            if [ -x "${FIREBASE_RUN}" ]; then
              "${FIREBASE_RUN}"
            else
              echo "warning: Firebase Crashlytics run script not found; skipping symbol upload"
            fi
          else
            echo "Firebase config absent; skipping Crashlytics symbol upload"
          fi

  ExamNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - ExamNotificationService
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kprl.exam.NotificationService
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ExamNotificationService/Info.plist
        SKIP_INSTALL: YES
