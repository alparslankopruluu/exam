  <path d="M90 112 q10 -14 20 0" stroke="#7FE0C2" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M130 112 q10 -14 20 0" stroke="#7FE0C2" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M108 126 q12 8 24 0" stroke="#9DB2FF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="80" cy="152" rx="9" ry="5" fill="#F0A9A0" opacity="0.35"/>
  <ellipse cx="160" cy="152" rx="9" ry="5" fill="#F0A9A0" opacity="0.35"/>
  <!-- sparkle -->
  <path d="M200 40 C203 52 207 56 219 59 C207 62 203 66 200 78 C197 66 193 62 181 59 C193 56 197 52 200 40 Z" fill="#B9C6FF"/>
