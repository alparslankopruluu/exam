<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="head" gradientUnits="userSpaceOnUse" x1="0" y1="52" x2="0" y2="170">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E9F7"/>
    </linearGradient>
    <linearGradient id="visor" gradientUnits="userSpaceOnUse" x1="60" y1="80" x2="180" y2="140">
      <stop offset="0" stop-color="#2E3A5E"/><stop offset="1" stop-color="#1C2440"/>
    </linearGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="168" x2="0" y2="232">
      <stop offset="0" stop-color="#8EA2FF"/><stop offset="1" stop-color="#5C6CF0"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="230" rx="62" ry="7" fill="#DCE4F2"/>
  <!-- antenna -->
  <rect x="116" y="26" width="8" height="30" rx="4" fill="#B4C0E0"/>
  <circle cx="120" cy="24" r="11" fill="#9DB2FF"/>
  <circle cx="117" cy="21" r="3.5" fill="#FFFFFF" opacity="0.8"/>
