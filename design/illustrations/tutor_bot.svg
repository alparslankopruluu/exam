  <rect x="38" y="96" width="18" height="40" rx="9" fill="#C9D3EA"/>
  <rect x="184" y="96" width="18" height="40" rx="9" fill="#C9D3EA"/>
  <!-- body -->
  <path d="M74 176 Q120 160 166 176 L174 222 Q120 236 66 222 Z" fill="url(#body)"/>
  <circle cx="120" cy="198" r="9" fill="#FFFFFF" opacity="0.85"/>
