  <!-- ears -->
  <ellipse cx="137" cy="158" rx="10" ry="15" fill="#E9BE9B"/>
  <ellipse cx="263" cy="158" rx="10" ry="15" fill="#E9BE9B"/>
  <!-- hair -->
  <path d="M132 150 Q122 84 172 70 Q190 52 220 62 Q262 60 272 104 Q282 130 268 156 Q262 124 240 110 Q226 126 196 120 Q176 132 152 126 Q140 138 132 150 Z" fill="#232A3D"/>
  <path d="M190 64 Q196 40 214 44 Q206 52 208 64 Z" fill="#232A3D"/>
  <path d="M232 66 Q252 50 262 66 Q248 64 240 74 Z" fill="#232A3D"/>
