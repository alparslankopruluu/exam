  <g transform="rotate(-8 200 340)">
    <rect x="128" y="300" width="150" height="34" rx="6" fill="url(#book2)"/>
    <rect x="136" y="306" width="134" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
    <rect x="120" y="330" width="166" height="44" rx="7" fill="url(#book1)"/>
    <rect x="128" y="338" width="150" height="8" rx="4" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <!-- sleeves -->
  <path d="M112 300 Q90 340 104 372 Q118 386 138 366 Q132 336 142 312 Z" fill="#ECE9E3"/>
  <path d="M288 300 Q312 330 300 358 Q288 372 266 352 Q270 326 258 310 Z" fill="#ECE9E3"/>
