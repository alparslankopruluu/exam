<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440">
  <defs>
    <linearGradient id="hoodie" gradientUnits="userSpaceOnUse" x1="0" y1="232" x2="0" y2="440">
      <stop offset="0" stop-color="#F6F4F0"/><stop offset="1" stop-color="#E4E1DB"/>
    </linearGradient>
    <linearGradient id="book1" gradientUnits="userSpaceOnUse" x1="120" y1="330" x2="286" y2="374">
      <stop offset="0" stop-color="#6F7FF5"/><stop offset="1" stop-color="#4B5AD6"/>
