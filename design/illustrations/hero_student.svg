  <ellipse cx="176" cy="150" rx="9" ry="11" fill="#1E2436"/>
  <ellipse cx="226" cy="150" rx="9" ry="11" fill="#1E2436"/>
  <circle cx="179" cy="145" r="3.4" fill="#FFFFFF"/>
  <circle cx="229" cy="145" r="3.4" fill="#FFFFFF"/>
  <!-- brows -->
  <path d="M162 130 Q176 122 188 128" stroke="#232A3D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M214 128 Q226 122 240 130" stroke="#232A3D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- cheeks + smile -->
  <ellipse cx="164" cy="174" rx="11" ry="6" fill="#F0A9A0" opacity="0.45"/>
  <ellipse cx="238" cy="174" rx="11" ry="6" fill="#F0A9A0" opacity="0.45"/>
  <path d="M188 182 Q201 192 214 182" stroke="#9A5B4C" stroke-width="4" fill="none" stroke-linecap="round"/>
